name: kiwi-dev
services:
  db:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    container_name: kiwi-mysql-dev
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kiwi-backend-dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.dev
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kiwi-frontend-dev
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.dev
    ports:
      - "5173:5173"
      - "9222:9222"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHROME_REMOTE_DEBUGGING_PORT=9222
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
