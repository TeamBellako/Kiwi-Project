apiVersion: batch/v1
kind: Job
metadata:
  name: kiwi-mysql-dev-init
  namespace: dev
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: kiwi-mysql-dev-init
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: kiwi-mysql-dev-init-script-volume
          configMap:
            name: kiwi-mysql-dev-init-script
      containers:
        - name: kiwi-mysql-dev-init
          image: mysql:8.0
          command: ["bash", "/scripts/init-db.sh"]
          env:
            - name: MYSQL_HOST
              value: kiwi-mysql-dev-service
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_INIT_TABLE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_INIT_TABLE
            - name: BACKEND_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: BACKEND_DB_USERNAME
            - name: BACKEND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: BACKEND_DB_PASSWORD
            - name: TEAM_ROLE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_ROLE
            - name: TEAM_01_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_01_USERNAME
            - name: TEAM_01_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_01_PASSWORD
            - name: TEAM_02_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_02_USERNAME
            - name: TEAM_02_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_02_PASSWORD
            - name: TEAM_03_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_03_USERNAME
            - name: TEAM_03_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: TEAM_03_PASSWORD
          volumeMounts:
            - name: kiwi-mysql-dev-init-script-volume
              mountPath: /scripts
