apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwi-backend-dev
  namespace: dev 
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: kiwi-backend-dev
  template:
    metadata:
      labels:
        app: kiwi-backend-dev
    spec:
      serviceAccountName: kiwi-ci-cd-service-account
      containers:
      - name: kiwi-backend-dev
        image: teambellako/kiwi-project:backend-dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /api/public/ping
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/public/ping
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/public/ping
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET
        - name: BACKEND_DB_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret  
              key: BACKEND_DB_URL_K8S
        - name: BACKEND_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: BACKEND_DB_USERNAME
        - name: BACKEND_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: BACKEND_DB_PASSWORD
      imagePullSecrets:
        - name: dockerhub-secret