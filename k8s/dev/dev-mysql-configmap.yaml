apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwi-mysql-dev-init-script
  namespace: dev
data:
  init-db.sh: |
    #!/usr/bin/bash
    set -e

    TMP_MY_CNF="/tmp/.my.cnf"

    cat <<EOF > ${TMP_MY_CNF}
    [client]
    host=${MYSQL_HOST}
    user=root
    password=${MYSQL_ROOT_PASSWORD}
    EOF

    chmod 600 ${TMP_MY_CNF}

    until mysqladmin --defaults-extra-file=${TMP_MY_CNF} ping --silent; do
      echo "Waiting for MySQL to be ready..."
      sleep 2
    done

    cat <<EOF > /tmp/init-db.sql
    CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE};

    USE ${MYSQL_DATABASE};

    CREATE USER IF NOT EXISTS '${BACKEND_DB_USERNAME}'@'%' IDENTIFIED BY '${BACKEND_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}.* TO '${BACKEND_DB_USERNAME}'@'%';

    CREATE ROLE IF NOT EXISTS '${TEAM_ROLE}';
    GRANT SELECT, INSERT ON ${MYSQL_DATABASE}.* TO '${TEAM_ROLE}';

    CREATE USER IF NOT EXISTS '${TEAM_01_USERNAME}'@'%' IDENTIFIED BY '${TEAM_01_PASSWORD}';
    CREATE USER IF NOT EXISTS '${TEAM_02_USERNAME}'@'%' IDENTIFIED BY '${TEAM_02_PASSWORD}';
    CREATE USER IF NOT EXISTS '${TEAM_03_USERNAME}'@'%' IDENTIFIED BY '${TEAM_03_PASSWORD}';

    GRANT ${TEAM_ROLE} TO '${TEAM_01_USERNAME}'@'%';
    GRANT ${TEAM_ROLE} TO '${TEAM_02_USERNAME}'@'%';
    GRANT ${TEAM_ROLE} TO '${TEAM_03_USERNAME}'@'%';

    FLUSH PRIVILEGES;

    EOF

    mysql --defaults-extra-file=${TMP_MY_CNF} < /tmp/init-db.sql

    rm -f /tmp/init-db.sql
    rm -f ${TMP_MY_CNF}
