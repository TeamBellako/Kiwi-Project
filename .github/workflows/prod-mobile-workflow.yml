name: Mobile CI/CD (Prod)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/prod-mobile-workflow.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/prod-mobile-workflow.yml'

jobs:
  mobile-tests:
    name: Run Android Tests (PR)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write .env (prod)
        run: |
          echo "${{ secrets.MOBILE_API_URL }}" > mobile/.env.prod
          echo "${{ secrets.MOBILE_COMPANY_EMAIL }}" >> mobile/.env.prod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Create AVD and snapshot (if needed)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: ./mobile
          script: echo "Generated AVD snapshot for caching."

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew
        working-directory: ./mobile

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./mobile
          script: ./gradlew connectedCheck

      - name: Run unit tests
        run: ./gradlew test
        working-directory: ./mobile

      - name: Run detekt
        run: ./gradlew detekt
        working-directory: ./mobile

  mobile-ci-cd:
    name: Build, Sign & Upload to Play (Prod)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write .env (prod)
        run: |
          echo "${{ secrets.MOBILE_API_URL }}" > mobile/.env.prod
          echo "${{ secrets.MOBILE_COMPANY_EMAIL }}" >> mobile/.env.prod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew
        working-directory: ./mobile

      - name: Generate version tag, push it, and export version info
        id: version
        if: ${{ startsWith(github.ref, 'refs/heads/main') }}  # avoid re-tagging on tag builds
        run: |
          set -e
          VERSION_BASE="v0.0."
          LATEST_TAG=$(git tag --sort=-v:refname | grep '^v0\.0\.' | head -n 1 || true)
          LAST_PATCH=$(echo ${LATEST_TAG:-v0.0.-1} | cut -d'.' -f3)
          NEXT_PATCH=$((LAST_PATCH + 1))
          NEW_TAG="${VERSION_BASE}${NEXT_PATCH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

          TAG=${NEW_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$TAG" >> $GITHUB_ENV

      - name: Fallback version info for tag builds
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$TAG" >> $GITHUB_ENV

      - name: Build AAB
        run: ./gradlew bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
        working-directory: ./mobile

      - name: Sign AAB
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: mobile/app/build/outputs/bundle/release
          signingKeyBase64: '${{ secrets.KEYSTORE }}'
          alias: '${{ secrets.SIGNING_KEY_ALIAS }}'
          keyStorePassword: '${{ secrets.SIGNING_STORE_PASSWORD }}'
          keyPassword: '${{ secrets.SIGNING_KEY_PASSWORD }}'

      - name: Upload app bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: mobile/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play Internal Test Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}'
          packageName: com.bellako.kiwi
          releaseFiles: 'mobile/app/build/outputs/bundle/release/app-release.aab'
          track: internal
          status: draft
