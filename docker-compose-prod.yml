name: kiwi-prod
services:
  db:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    restart: always
    env_file:
      - ./.env.prod
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kiwi-backend-prod
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.prod
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: kiwi-frontend-prod
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.prod
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
